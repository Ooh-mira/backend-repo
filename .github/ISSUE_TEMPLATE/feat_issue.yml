name: 기능 구현 (Feat)
description: API 구현 작업을 위한 템플릿
title: "[Feat]: "
labels: ["feat"]
body:
  - type: input
    id: branch_keyword
    attributes:
      label: "Branch Keyword"
      description: "영문 소문자로 간결한 브랜치 명을 입력하세요 (예: employee, login-modal)"
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: "구현할 기능"
      description: "어떤 기능을 구현할지 간략하게 설명해주세요"
    validations:
      required: true